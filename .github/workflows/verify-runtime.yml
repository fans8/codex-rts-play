name: Verify public runtime
on:
  workflow_dispatch:
  pull_request:
    paths: ['site/**', 'deployment-manifest.json', '.github/workflows/verify-runtime.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify registered Raider 1x identity, every byte and public isolation
        run: |
          python3 - <<'PYCODE'
          import json,pathlib,hashlib,re
          manifest=json.load(open('deployment-manifest.json'))
          assert manifest['ownerAcceptanceRequired'] is False
          assert manifest['version']=='2026.10.09-raider-1x-latest-v1'
          assert manifest['sourceId']=='b302d4532702be7c5cec119867f96becfb70bf740970b62716ebeee74a447257'
          assert manifest['assetBuildId']=='a14f5806014cd5437eadaaa8d797f5c612dd540943cf5c6bcb43e46e1c006111'
          assert manifest['buildDerivationId']=='956e917100b1f8ca6b9c329938569c32f224d42b00759782df96aa0d08a287e0'
          assert manifest['OwnerAuthorizationSha256']=='3ac6c3705afbe6165787c0680ed7f7ec58083f099906a16b58be8de631b90099'
          assert manifest['PMDelegatedFormalAcceptanceSha256']=='80528dbf7cf35dc5e7ce3a37dd701a5c505523cafc859fdc31cd3d7715f22fcd'
          assert manifest['registeredAuthoritySha256']=='c965aeaf940555bef460f83644a54b29ddd32eeedbbb9b4dc4ece86b4264f6e1'
          assert manifest['publicBase']=='/codex-rts-play/' and manifest['selector']=='default-no-query'
          root=pathlib.Path('site');expected={e['path']:e for e in manifest['files']}
          assert len(expected)==len(manifest['files'])==2151
          actual={str(p.relative_to(root))for p in root.rglob('*')if p.is_file() or p.is_symlink()};assert actual==set(expected)
          for name,e in expected.items():
            assert not name.startswith('/') and '..' not in pathlib.Path(name).parts
            p=root/name;assert not p.is_symlink();b=p.read_bytes();assert len(b)==e['bytes'] and hashlib.sha256(b).hexdigest()==e['sha256'],name
            assert not b.startswith(b'version https://git-lfs.github.com/spec/v1')
            assert p.suffix!='.map' and not name.startswith(('src/','docs/','internal/','tests/'))
            if p.suffix in ['.js','.json','.html','.css','.svg','.txt']:
              assert not re.search(rb'/Users/|/private/|\.private/|/source-v[12]/|codex_import|sourceMappingURL=|BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}',b),name
              assert all(t not in b for t in [b'__missileTurretQa',b'__unitPolishQa',b'localhost',b'127.0.0.1',b'__shadeQa',b'__transportQa',b'__raider16Qa',b'__raiderPersistentWreckQa']),name
          version=json.load(open(root/'release-version.json'))
          for k in ['version','sourceId','assetBuildId','buildDerivationId','acceptedBehaviorSourceId','selector']:assert version[k]==manifest[k],k
          assert version['formalDefault'] is True and version['channel']=='formal-release'
          assert version['raider1xR1']['sourceId']==version['sourceId']
          assert version['raider1xR1']['variant']=='combined' and version['raider1xR1']['formalDefault'] is True
          assert version['raider1xR1']['formalHandoffSha256']=='9066009211666ebebca46e41b846feed49bc80536e83b7602e3e5a084caabfce'
          assert version['missileBinding']['sourceId']==manifest['retainedMissileSourceId']=='020b49fff55f5617bab96bdc525011f2805a07b8f37600ab56e4baf0f9763c54'
          assert manifest['immutableBuildInputRegistrySha256']=='be8e0ab470be8ceaab28f981ce58e617d7d3ea95671920e0caa848eb17033b87'
          assert version['missileBinding']['registrySha256']==manifest['retainedMissileInputRegistrySha256']=='138b04d70d19208201cef71e74c3f2dc9b185fae229f53f66dfe361dbe004f19'
          print(manifest['version'],len(expected),'registered exact Raider 1x runtime files verified')
          PYCODE
