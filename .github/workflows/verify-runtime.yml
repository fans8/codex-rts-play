name: Verify public runtime
on:
  workflow_dispatch:
  pull_request:
    paths: ['site/**', 'deployment-manifest.json', '.github/workflows/verify-runtime.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify public runtime identity and file bytes
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib, json, re
          root = Path('site')
          manifest = json.loads(Path('deployment-manifest.json').read_bytes())
          version = json.loads((root/'release-version.json').read_bytes())
          assert {k:v for k,v in manifest.items() if k!='files'}==version
          assert version['channel']=='formal-release' and version['entryMode']=='formal'
          assert version['selector']=='default-no-query' and version['formalDefault'] is True
          assert version['sourceId']==version['publicDerivationID']
          expected = {row['path']:row for row in manifest['files']}
          assert len(expected)==len(manifest['files'])
          assert {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}==set(expected)
          for name, record in expected.items():
              assert '..' not in Path(name).parts and not Path(name).is_absolute()
              path = root/name
              data = path.read_bytes()
              assert not path.is_symlink()
              assert len(data)==record['bytes'] and hashlib.sha256(data).hexdigest()==record['sha256'],name
              assert not data.startswith(b'version https://git-lfs.github.com/spec/v1')
              if path.suffix in ('.js','.mjs','.html','.json','.css','.svg'):
                  assert not re.search(rb'/Users/|/private/|\.private/|codex_import|sourceMappingURL=|__skyguardQa|__dreadnoughtAudioReadback',data),name
          entry = (root/'play/index.html').read_bytes()
          assert entry==(root/'index.html').read_bytes()==(root/'science/host/index.html').read_bytes()
          host = (root/'science/host/game.js').read_bytes()
          assert version['sourceId'].encode() in host and version['version'].encode() in host
          assert hashlib.sha256((root/'science/compact-resource-manifest-g-v1.json').read_bytes()).hexdigest()==version['resourceSHA256']
          print(version['version'],len(expected),'exact distribution files')
          PYCODE

